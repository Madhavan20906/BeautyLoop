services:
  - type: web
    name: beautyloop
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: YOUCAM_BASE_URL
        value: https://yce-api-01.makeupar.com
      - key: YOUCAM_API_KEY
        sync: false
