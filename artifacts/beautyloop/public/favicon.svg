<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2F25"/>
      <stop offset="100%" stop-color="#284435"/>
    </linearGradient>
    <linearGradient id="rose-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D1C2"/>
      <stop offset="50%" stop-color="#D49B83"/>
      <stop offset="100%" stop-color="#B87562"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8C695"/>
      <stop offset="100%" stop-color="#FCEFD8"/>
    </linearGradient>
  </defs>

  <!-- Premium rounded squircle badge -->
  <rect width="180" height="180" rx="44" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="176" height="176" rx="42" stroke="rgba(212,155,131,0.25)" stroke-width="2"/>

  <!-- Outer looping continuous curve (The Beauty Loop) -->
  <path d="M54 134 C42 120 40 92 52 74 C66 54 94 52 112 68 C128 82 136 106 126 122 C116 138 92 142 78 132 C68 124 66 112 72 102 C80 88 106 82 120 94"
        stroke="url(#rose-gold)"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Inner delicate harmonic accent -->
  <path d="M68 84 C82 68 108 72 118 90 C124 102 118 116 106 120 C96 124 84 116 82 106 C80 94 92 86 102 88"
        stroke="url(#amber-glow)"
        stroke-width="5"
        stroke-linecap="round"
        fill="none"
        opacity="0.9"/>

  <!-- Central core vitality sparkle -->
  <circle cx="98" cy="94" r="5" fill="#FFF2DF"/>
</svg>
